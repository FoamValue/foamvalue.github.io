<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="gbad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="ggood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0abde3"/>
      <stop offset="100%" style="stop-color:#48dbfb"/>
    </linearGradient>
  </defs>

  <!-- 标题 -->
  <text x="360" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">间距决定品质感</text>
  <text x="360" y="55" text-anchor="middle" font-size="12" fill="#999">同样的内容，不同的间距，差异一目了然</text>

  <!-- 左侧：差间距 -->
  <rect x="30" y="75" width="310" height="28" rx="4" fill="url(#gbad)" opacity="0.15"/>
  <text x="185" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#ee5a24">❌ 间距过密</text>

  <rect x="30" y="115" width="310" height="220" rx="8" fill="#fff" stroke="#ffcccc" stroke-width="1"/>
  <rect x="50" y="130" width="270" height="36" rx="6" fill="#f0f0f0"/>
  <text x="185" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">卡片标题</text>
  <text x="185" y="168" text-anchor="middle" font-size="10" fill="#999">卡片副标题或描述</text>

  <line x1="50" y1="178" x2="320" y2="178" stroke="#eee" stroke-width="1"/>

  <rect x="50" y="186" width="270" height="30" rx="4" fill="#f5f5f5"/>
  <text x="185" y="205" text-anchor="middle" font-size="11" fill="#666">列表项一</text>
  <rect x="50" y="218" width="270" height="30" rx="4" fill="#f5f5f5"/>
  <text x="185" y="237" text-anchor="middle" font-size="11" fill="#666">列表项二</text>
  <rect x="50" y="250" width="270" height="30" rx="4" fill="#f5f5f5"/>
  <text x="185" y="269" text-anchor="middle" font-size="11" fill="#666">列表项三</text>

  <line x1="50" y1="288" x2="320" y2="288" stroke="#eee" stroke-width="1"/>

  <rect x="50" y="296" width="270" height="28" rx="6" fill="#ff6b6b"/>
  <text x="185" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">提交</text>

  <!-- 箭头 -->
  <text x="360" y="220" text-anchor="middle" font-size="30" fill="#ddd">→</text>

  <!-- 右侧：好间距 -->
  <rect x="380" y="75" width="310" height="28" rx="4" fill="url(#ggood)" opacity="0.15"/>
  <text x="535" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#0abde3">✅ 间距舒适</text>

  <rect x="380" y="115" width="310" height="220" rx="8" fill="#fff" stroke="#b3e0ff" stroke-width="1"/>
  <rect x="400" y="128" width="270" height="44" rx="6" fill="#f8f9fa"/>
  <text x="535" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">卡片标题</text>
  <text x="535" y="170" text-anchor="middle" font-size="11" fill="#8c8c8c">卡片副标题或描述</text>

  <line x1="400" y1="182" x2="670" y2="182" stroke="#f0f0f0" stroke-width="1"/>

  <rect x="400" y="196" width="270" height="36" rx="4" fill="#f5f5f5"/>
  <text x="535" y="219" text-anchor="middle" font-size="12" fill="#595959">列表项一</text>
  <rect x="400" y="242" width="270" height="36" rx="4" fill="#f5f5f5"/>
  <text x="535" y="265" text-anchor="middle" font-size="12" fill="#595959">列表项二</text>
  <rect x="400" y="288" width="270" height="36" rx="4" fill="#f5f5f5"/>
  <text x="535" y="311" text-anchor="middle" font-size="12" fill="#595959">列表项三</text>

  <!-- 底部总结 -->
  <rect x="150" y="340" width="420" height="16" rx="8" fill="#f0f0f0"/>
  <text x="360" y="352" text-anchor="middle" font-size="10" fill="#999">同样的内容，右侧因为间距更舒适，看起来更"高级"</text>
</svg>
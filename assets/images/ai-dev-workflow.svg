<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">AI 辅助开发工作流</text>

  <!-- 五个阶段节点 -->
  <g filter="url(#shadow)">
    <rect x="20" y="65" width="120" height="80" rx="12" fill="url(#g1)"/>
    <text x="80" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">需求分析</text>
    <text x="80" y="120" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">自然语言描述</text>
    <text x="80" y="136" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">AI 辅助拆分</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="185" y="65" width="120" height="80" rx="12" fill="url(#g2)"/>
    <text x="245" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">架构设计</text>
    <text x="245" y="120" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">AI 推荐方案</text>
    <text x="245" y="136" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">人审决策</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="65" width="120" height="80" rx="12" fill="url(#g3)"/>
    <text x="410" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">代码实现</text>
    <text x="410" y="120" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">AI 生成代码</text>
    <text x="410" y="136" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">人工审查修改</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="515" y="65" width="120" height="80" rx="12" fill="url(#g4)"/>
    <text x="575" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">测试验证</text>
    <text x="575" y="120" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">AI 生成用例</text>
    <text x="575" y="136" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">自动化执行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="65" width="100" height="80" rx="12" fill="url(#g5)"/>
    <text x="730" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">部署上线</text>
    <text x="730" y="120" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">CI/CD 发布</text>
  </g>

  <!-- 箭头连接 -->
  <line x1="140" y1="105" x2="180" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="105" x2="345" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="105" x2="510" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="105" x2="675" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 反馈循环 -->
  <path d="M730,150 L730,200 Q730,220 710,220 L80,220 Q60,220 60,200 L60,150" fill="none" stroke="#fa709a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#999">反馈循环：每个阶段发现问题可回溯到上一阶段</text>

  <!-- 角色说明 -->
  <rect x="250" y="245" width="120" height="24" rx="12" fill="#eee"/>
  <text x="310" y="261" text-anchor="middle" font-size="11" fill="#666">💡 AI 辅助 + 人决策</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Scrum 框架概览</text>

  <!-- Product Backlog -->
  <g filter="url(#shadow)">
    <rect x="30" y="60" width="180" height="120" rx="12" fill="url(#g1)"/>
    <text x="120" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Product Backlog</text>
    <text x="120" y="115" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">产品待办列表</text>
    <text x="120" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">PO 维护，按优先级排序</text>
    <text x="120" y="158" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">所有需求的唯一来源</text>
  </g>

  <!-- Arrow 1 -->
  <text x="225" y="120" text-anchor="middle" font-size="22" fill="#ccc">→</text>

  <!-- Sprint Planning -->
  <rect x="250" y="60" width="140" height="50" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="320" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Sprint Planning</text>
  <text x="320" y="100" text-anchor="middle" font-size="10" fill="#e65100">迭代计划会</text>

  <!-- Sprint Backlog -->
  <g filter="url(#shadow)">
    <rect x="415" y="60" width="180" height="120" rx="12" fill="url(#g2)"/>
    <text x="505" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Sprint Backlog</text>
    <text x="505" y="115" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">迭代待办列表</text>
    <text x="505" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">本次 Sprint 要完成的故事</text>
    <text x="505" y="158" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">团队自己认领任务</text>
  </g>

  <!-- Arrow 2 -->
  <text x="610" y="120" text-anchor="middle" font-size="22" fill="#ccc">→</text>

  <!-- Increment -->
  <g filter="url(#shadow)">
    <rect x="635" y="60" width="140" height="120" rx="12" fill="url(#g3)"/>
    <text x="705" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Increment</text>
    <text x="705" y="115" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">可用的增量</text>
    <text x="705" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">符合 DoD</text>
    <text x="705" y="158" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">可交付给用户</text>
  </g>

  <!-- Sprint Cycle -->
  <rect x="90" y="210" width="620" height="110" rx="14" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Sprint 周期（1-4 周）</text>

  <g filter="url(#shadow)">
    <rect x="110" y="248" width="130" height="55" rx="8" fill="url(#g4)"/>
    <text x="175" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Daily Scrum</text>
    <text x="175" y="290" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">每日站会 · 15 分钟</text>
  </g>

  <text x="255" y="278" text-anchor="middle" font-size="16" fill="#ccc">→</text>

  <g filter="url(#shadow)">
    <rect x="275" y="248" width="130" height="55" rx="8" fill="url(#g5)"/>
    <text x="340" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Sprint Review</text>
    <text x="340" y="290" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">迭代评审会 · 2 小时</text>
  </g>

  <text x="420" y="278" text-anchor="middle" font-size="16" fill="#ccc">→</text>

  <g filter="url(#shadow)">
    <rect x="440" y="248" width="130" height="55" rx="8" fill="url(#g1)"/>
    <text x="505" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Retrospective</text>
    <text x="505" y="290" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">迭代回顾会 · 1.5 小时</text>
  </g>

  <text x="585" y="278" text-anchor="middle" font-size="16" fill="#ccc">→</text>

  <g filter="url(#shadow)">
    <rect x="605" y="248" width="85" height="55" rx="8" fill="url(#g2)"/>
    <text x="648" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">下一轮</text>
    <text x="648" y="292" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">Sprint</text>
  </g>

  <!-- Feedback Loop -->
  <path d="M 705 180 L 705 200 Q 705 210 695 210 L 120 210 Q 110 210 110 200 L 110 185" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" fill="#ff9800" font-weight="bold">↑ 反馈循环：Review 和 Retro 的结论影响下一轮 Backlog 的优先级 ↑</text>

  <!-- 底部 -->
  <rect x="120" y="370" width="560" height="36" rx="18" fill="#f0f0f0"/>
  <text x="400" y="391" text-anchor="middle" font-size="11" fill="#666">核心原则：透明 · 检视 · 调整 ｜ 小步快跑，持续交付</text>
</svg>
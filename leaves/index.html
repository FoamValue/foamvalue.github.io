</div>

<style>
  /* ===== 树叶课堂 ===== */
  /* 变量同时挂到 .leaf-modal：弹窗是 .leaves-page 的兄弟节点，需单独取得变量 */
  .leaves-page, .leaf-modal { --leaf-green: #16a34a; --leaf-green-dark: #15803d; --leaf-cream: #fdf9ef; }

  .leaves-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 28px 32px; border-radius: 28px;
    background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 55%, #fefce8 100%);
    border: 2px dashed #bbf7d0;
  }
  .leaves-title { margin: 0; font-size: 34px; font-weight: 700; color: var(--leaf-green-dark); letter-spacing: 2px; }
  .leaves-title-emoji { display: inline-block; transform-origin: bottom center; animation: leaf-sway 3s ease-in-out infinite; }
  @keyframes leaf-sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  .leaves-subtitle { margin: 8px 0 0; font-size: 17px; color: #4d7c0f; }

  .leaves-immersive-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--leaf-green); color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 6px 16px rgba(22, 163, 74, .35); transition: transform .15s ease, background .15s ease;
  }
  .leaves-immersive-btn:hover { background: var(--leaf-green-dark); transform: translateY(-2px); }
  .leaves-immersive-btn:active { transform: translateY(0); }

  .leaves-grid {
    margin-top: 28px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
  }
  @media (max-width: 1024px) { .leaves-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .leaves-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }

  .leaf-card {
    position: relative; border: none; padding: 0; cursor: pointer; text-align: center;
    background: var(--color-bg-card, #fff); border-radius: 22px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(22, 101, 52, .10);
    transition: transform .2s ease, box-shadow .2s ease;
    font-family: inherit;
  }
  .leaf-card:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 12px 24px rgba(22, 101, 52, .18); }
  .leaf-card:focus-visible { outline: 3px solid var(--leaf-green); outline-offset: 3px; }

  .leaf-card-media { aspect-ratio: 1 / 1; overflow: hidden; }
  .leaf-card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .leaf-card-body { padding: 14px 10px 18px; background: var(--leaf-cream); }
  .leaf-card-name { font-size: 26px; font-weight: 700; color: #1f2937; letter-spacing: 3px; line-height: 1.2; }
  .leaf-card-pinyin { margin-top: 4px; font-size: 15px; color: var(--leaf-green); letter-spacing: 1px; }

  .leaves-tip { margin-top: 26px; text-align: center; font-size: 14px; color: var(--color-text-tertiary, #71717a); }

  /* ===== 沉浸模式：全屏时隐藏头尾 ===== */
  html.is-immersive .site-header,
  html.is-immersive .site-footer { display: none !important; }
  html.is-immersive .main-content { max-width: 100%; padding: 20px clamp(12px, 3vw, 40px) 0; }
  html.is-immersive .leaves-hero { padding: 16px 24px; border-radius: 20px; }
  html.is-immersive .leaves-title { font-size: 26px; }
  html.is-immersive .leaves-subtitle { font-size: 15px; margin-top: 4px; }
  html.is-immersive .leaves-grid { margin-top: 18px; gap: 18px; }
  html.is-immersive .leaves-tip { display: none; }

  /* ===== 详情弹窗 ===== */
  .leaf-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .leaf-modal[hidden] { display: none; }
  .leaf-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 42, 23, .55); backdrop-filter: blur(3px); }
  .leaf-modal-card {
    position: relative; width: min(880px, 100%); height: min(560px, 88vh); overflow: auto;
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0;
    background: var(--leaf-cream); border-radius: 28px; box-shadow: 0 24px 64px rgba(0, 0, 0, .3);
    animation: leaf-pop .25s ease;
  }
  @keyframes leaf-pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 700px) { .leaf-modal-card { grid-template-columns: 1fr; height: min(680px, 94vh); } }

  .leaf-modal-media { min-height: 320px; }
  .leaf-modal-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 700px) { .leaf-modal-media { min-height: 0; max-height: 300px; } }

  .leaf-modal-body { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 16px; }
  .leaf-modal-close {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer;
    background: rgba(255, 255, 255, .9); color: #374151;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15); transition: transform .15s ease;
  }
  .leaf-modal-close:hover { transform: rotate(90deg); }

  .leaf-modal-chars { display: flex; gap: 12px; }
  .leaf-char {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 84px; padding: 10px 14px 12px; border-radius: 18px;
    background: #fff; border: 2px solid #d9f0dd;
  }
  .leaf-char-pinyin { font-size: 17px; font-weight: 600; color: var(--leaf-green); letter-spacing: 1px; }
  .leaf-char-hanzi { font-size: 40px; font-weight: 700; color: #1f2937; line-height: 1.15; }

  .leaf-modal-facts { display: flex; flex-direction: column; gap: 8px; }
  .leaf-fact-row { display: flex; align-items: baseline; gap: 10px; font-size: 15px; }
  .leaf-fact-label {
    flex: none; padding: 3px 12px; border-radius: 999px;
    background: #dcfce7; color: var(--leaf-green-dark); font-weight: 600; font-size: 13px;
  }
  .leaf-fact-value { color: #374151; }

  .leaf-modal-intro {
    margin: 0; font-size: 17px; line-height: 1.9; color: #374151;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  .leaf-modal-fun {
    padding: 14px 16px; border-radius: 16px;
    background: #fef9c3; border: 1.5px dashed #fde047;
  }
  .leaf-fun-badge { display: block; font-weight: 700; color: #a16207; margin-bottom: 6px; font-size: 14px; }
  .leaf-modal-fun p {
    margin: 0; font-size: 15px; line-height: 1.8; color: #713f12;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .leaf-modal-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; }
  .leaf-nav-btn {
    padding: 10px 20px; border: 2px solid #bbf7d0; border-radius: 999px; cursor: pointer;
    background: #fff; color: var(--leaf-green-dark); font-size: 15px; font-weight: 600;
    transition: background .15s ease, transform .15s ease;
  }
  .leaf-nav-btn:hover { background: #f0fdf4; transform: translateY(-2px); }

  @media (max-width: 640px) {
    .leaves-hero { padding: 20px; }
    .leaves-title { font-size: 26px; }
    .leaf-card-name { font-size: 20px; letter-spacing: 2px; }
    .leaf-modal-body { padding: 20px; }
    .leaf-char { min-width: 64px; padding: 8px 10px 10px; }
    .leaf-char-hanzi { font-size: 30px; }
  }
</style>

  LEAVES.forEach(function (leaf, i) {

      '<span class="leaf-card-media"><img src="' + imgBase + leaf.img + '" alt="' + leaf.name + '" loading="lazy"></span>' +
      '<span class="leaf-card-body"><span class="leaf-card-name">' + leaf.name + '</span>' +
      '<span class="leaf-card-pinyin">' + leaf.chars.map(function (c) { return c[1]; }).join(' ') + '</span></span>';

    grid.appendChild(card);
  });

  /* 详情弹窗 */
  function openModal(i) {
    current = (i + LEAVES.length) % LEAVES.length;
    var leaf = LEAVES[current];
    var img = document.getElementById('leaf-modal-img');
    img.src = imgBase + leaf.img;
    img.alt = leaf.name + '图片';
    document.getElementById('leaf-modal-chars').innerHTML = leaf.chars.map(function (c) {
      return '<span class="leaf-char"><span class="leaf-char-pinyin">' + c[1] + '</span>' +
             '<span class="leaf-char-hanzi">' + c[0] + '</span></span>';
    }).join('');
    document.getElementById('leaf-modal-shape').textContent = leaf.shape;
    document.getElementById('leaf-modal-color').textContent = leaf.color;
    document.getElementById('leaf-modal-intro').textContent = leaf.intro;
    document.getElementById('leaf-modal-fun').textContent = leaf.fun;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = '';
  }

  modal.addEventListener('click', function (e) {
    if (e.target.closest('[data-leaf-close]')) closeModal();
  });
  document.getElementById('leaf-prev').addEventListener('click', function () { openModal(current - 1); });
  document.getElementById('leaf-next').addEventListener('click', function () { openModal(current + 1); });
  document.addEventListener('keydown', function (e) {
    if (modal.hidden) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') openModal(current - 1);
    if (e.key === 'ArrowRight') openModal(current + 1);
  });

  /* 沉浸模式：进入/退出全屏时隐藏头尾 */
  var immersiveBtn = document.getElementById('leaves-immersive-btn');
  var immersiveLabel = immersiveBtn.querySelector('.leaves-immersive-label');
  var fallbackImmersive = false;

  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function syncImmersive() {
    var active = !!fullscreenElement() || fallbackImmersive;
    document.documentElement.classList.toggle('is-immersive', active);
    immersiveLabel.textContent = active ? '退出沉浸' : '沉浸学习';
  }

  immersiveBtn.addEventListener('click', function () {
    var root = document.documentElement;
    if (!fullscreenElement() && !fallbackImmersive) {
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      if (request) {
        var result = request.call(root);
        if (result && result.catch) {
          result.catch(function () {
            /* 全屏被拒绝时降级为页面内沉浸模式 */
            fallbackImmersive = true;
            syncImmersive();
          });
        }
      } else {
        fallbackImmersive = true;
        syncImmersive();
      }
    } else if (fullscreenElement()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    } else {
      fallbackImmersive = false;
      syncImmersive();
    }
  });

  document.addEventListener('fullscreenchange', syncImmersive);
  document.addEventListener('webkitfullscreenchange', syncImmersive);
  syncImmersive();
})();
</script>
